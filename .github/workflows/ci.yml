name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Actions are pinned to a commit, so a moved tag cannot change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check formatting
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...
      - name: Check that the web page's reader builds
        if: runner.os == 'Linux'
        run: GOOS=js GOARCH=wasm go vet ./cmd/wasm && GOOS=js GOARCH=wasm go build -o /dev/null ./cmd/wasm
      - name: Check the extension's JavaScript
        run: |
          node --check vscode/extension.js
          node --check vscode/explain.js
          node --test "vscode/test/*.test.js"
