# Builds, signs and publishes a release when a version tag is pushed:
#
#   git tag v0.4.0
#   git push origin v0.4.0
#
# Every file gets a signed build provenance (Sigstore, through GitHub
# artifact attestations), so anyone can check that it was built here from
# this repository:
#
#   gh attestation verify lookfirst-win32-x64-0.4.0.vsix --repo Idris1980/lookfirst

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # create the release
      id-token: write     # sign with Sigstore
      attestations: write # store the signatures
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Check that the tag matches the extension version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./vscode/package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match vscode/package.json version $version"
            exit 1
          fi

      - run: go test ./...
      - run: node --test "vscode/test/*.test.js"

      - name: Install the extension's dependency, exactly as locked
        working-directory: vscode
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build every platform and package the extension
        shell: pwsh
        run: ./scripts/build.ps1 -Package

      - name: Make a software bill of materials
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: lookfirst.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Sign the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            vscode/bin/lookfirst-*
            vscode/*.vsix
            lookfirst.spdx.json

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          v="${TAG#v}"
          notes="Install the extension for your platform in VS Code, for example on Windows: code --install-extension lookfirst-win32-x64-$v.vsix
          The lookfirst-* files are the command-line program for each platform.
          Every file is signed. Check one with: gh attestation verify lookfirst-win32-x64-$v.vsix --repo Idris1980/lookfirst"
          gh release create "$TAG" --verify-tag --title "LookFirst $TAG" --notes "$notes" \
            vscode/bin/lookfirst-* vscode/bin/SHA256SUMS.txt vscode/*.vsix lookfirst.spdx.json
