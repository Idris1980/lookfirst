# LookFirst checks its own pull requests with its own action. The examples
# are risky on purpose, so this shows the findings but does not fail.
name: LookFirst

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write # for the summary comment

jobs:
  lookfirst:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./
        with:
          path: .
          fail-on: none
