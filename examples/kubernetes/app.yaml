# A Deployment with a public load balancer, as an AI assistant might write
# it when asked to "deploy my app to Kubernetes".
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shop
  template:
    metadata:
      labels:
        app: shop
    spec:
      containers:
        - name: shop
          image: myregistry.azurecr.io/shop:latest
          ports:
            - containerPort: 8080
          env:
            - name: DB_PASSWORD
              value: "P@ssw0rd!"
            - name: STRIPE_KEY
              valueFrom:
                secretKeyRef:
                  name: shop-secrets
                  key: stripe
          securityContext:
            privileged: true
---
apiVersion: v1
kind: Service
metadata:
  name: shop
spec:
  type: LoadBalancer
  selector:
    app: shop
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: shop-debug
spec:
  type: LoadBalancer
  selector:
    app: shop
  ports:
    - port: 22
---
apiVersion: v1
kind: Secret
metadata:
  name: shop-secrets
stringData:
  stripe: sk_test_example
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop
spec:
  rules:
    - host: shop.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shop
                port:
                  number: 80
